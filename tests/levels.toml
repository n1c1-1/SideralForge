# Level 3 = too heavy for the fast suite (tests/README.md). tests/conftest.py adds the `level3` marker to what is named
# here, so that no test file has to be edited for it. `python tools/t.py 3` runs them; `pytest file.py::test` and
# `pytest -k name` run a named test whatever its level.
#
# Each entry is a file, a test (its parametrizations too), or an fnmatch pattern on the node id. Why a test is here:
#   screenshots  - it opens the screens and saves images (tools/client_walkthrough.py and the *_shots tests)
#   real data    - it reads the test project (tests/conftest.py TEST_PROJECT) or the heart_a7s raw frames
#   worker       - it starts a detached engine worker, or another subprocess that runs more than a few seconds
#   heavy        - more than about 4 s of work on synthetic data that could not be made smaller without losing the point
# The time-budget lines at the end of a level 1 / 2 run name the tests over 2 s: lighten them, or add them here.
# Times are measured on this machine, CPU only, while it was busy (so they are an upper bound).

level3 = [
    # ---- by name: a new test that follows the convention is in level 3 without anyone editing this file ---------------
    "tests/client/*::test_real_*",     # real data: the client tests that read real data say it in their name
    "*screenshots*",                   # screenshots: test_screenshots_en_and_fr, test_real_screenshots_en_fr, ...
    "*::test_shots*",                  # the screens of a module in both languages
    "*::test_the_shots_*",
    # ---- engine -------------------------------------------------------------------------------------------------
    "tests/test_api.py::test_a_detached_run_is_followed_through_events_and_cancelled",             # worker, 9 s

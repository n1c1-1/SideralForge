[project]
name = "astro-gpu"
version = "0.1.0"
description = "GPU astrophotography processing: Gaia-calibrated stacking, physical sky background, modelled stars and interactive rendering"
readme = "README.md"
requires-python = ">=3.11,<3.13"
authors = [{ name = "Nicolas" }]
dependencies = [
    "numpy>=2.0",
    "scipy>=1.13",
    "opencv-python>=4.10",
    "astropy>=6.1",
    "astroquery>=0.4.7",
    "astroalign>=2.5",
    "sep>=1.2",
    "rawpy>=0.21",
    "tifffile>=2024.5",
    "pillow>=10.3",
    "torch>=2.4",
    "pydantic>=2.7",
    "psutil>=5.9",
    "PySide6>=6.7",
    "colour-science>=0.4.4",
    "photutils>=1.13",
    "matplotlib>=3.8",
    "exifread>=3.0",
    "reproject>=0.13",
]

[project.optional-dependencies]
dev = ["pytest>=8.2", "ruff>=0.6"]

[project.scripts]
astro-gpu = "astro_gpu.cli:main"

[project.gui-scripts]
astro-gpu-gui = "astro_gpu.gui.app:main"
astro-gpu-client = "astro_gpu.client.app:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["astro_gpu"]

[tool.uv.sources]
torch = [{ index = "pytorch-cu128" }]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.ruff]
line-length = 130
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["E741", "B905", "B023"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# the default run is level 2, the fast suite (tests/README.md); tools/t.py 3 / 4 give -m of their own. Keep this -m
# equal to DEFAULT_MARK in tests/conftest.py. pytest-xdist (-n) is used by tools/t.py, not forced here.
addopts = "-m 'not level3 and not slow and not network'"
markers = [
    "gpu: needs a CUDA device",
    "network: needs internet access",
    "slow: long-running, real data sets (level 4: tools/t.py 4)",
    "level3: too heavy for the fast suite (set from tests/levels.toml, not in the test files; tools/t.py 3)",
]
